pid         logs/nginx.pid;
error_log   logs/nginx-main_error.log debug;

worker_processes  auto;
# worker_connections is capped by the per-worker file-descriptor limit, which is
# 1024 by default in the container. Raise it so the 4096 below is real: a proxied
# connection costs two descriptors, one to the client and one to the backend.
worker_rlimit_nofile 8192;
daemon off;

events {
    worker_connections  4096;  # Increase the number of connections per worker
    multi_accept on;  # Enable multi_accept to accept multiple connections at once
    use epoll;  # Use epoll event method for better performance on Linux
}

http {
    # Increase buffer sizes to handle high traffic
    client_body_buffer_size 10m;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    keepalive_timeout 65;
    keepalive_requests 100000;

    server{
        listen 80;
        server_name 0.0.0.0;

        # Lets encrypt challenge location
        location ~ /\.well-known/acme-challenge/(.*) {
            allow all;
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server{
        listen 443 ssl;
        server_name 0.0.0.0;

        ssl_certificate     /certificates/server.pem;
        ssl_certificate_key /certificates/serverKey.pem;

        location / {
            proxy_pass http://app:8013;
            # /conversations/query streams tokens as server-sent events. nginx
            # buffers proxied responses by default, which holds the whole answer
            # until the backend finishes and defeats the streaming entirely.
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;  # a slow model can take a while to emit its first token
            proxy_connect_timeout 15s;  # Limit time to establish a connection to the backend
            proxy_buffer_size 16k;
            proxy_buffers 4 64k;
            proxy_busy_buffers_size 128k;
            proxy_temp_file_write_size 128k;
            proxy_max_temp_file_size 1024m;
        }
    }
}
