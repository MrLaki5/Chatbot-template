services:
  db:
    container_name: cb_template_db
    build: ./db
    restart: always
    expose:
     - 5432
    environment:
     - POSTGRES_PASSWORD=postgres
     - PGDATA=/var/lib/postgresql/data
    volumes:
       - ./db_persist_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: cb_template_app
    build: ./app
    restart: always
    expose:
      - 8013
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY:?not set - copy .example.env to .env and fill it in}

  nginx:
    container_name: cb_template_nginx
    build: ./nginx
    depends_on:
     - app
    restart: always
    ports:
      - 443:443
      - 80:80
    environment:
      - PROD=${PROD:-false}
    volumes:
      - ./certificates:/etc/letsencrypt
      - ./webroot:/var/www/certbot
