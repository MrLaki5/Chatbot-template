services:
  redis:
    image: redis:7.0
    container_name: cb_template_redis
    restart: always
    expose:
      - 6379

  db:
    container_name: cb_template_db
    build: ./db
    restart: always
    expose:
     - 5432
    environment:
     - POSTGRES_PASSWORD=postgres
     - PGDATA=/var/lib/postgresql/data
    volumes:
       - ./db_persist_data:/var/lib/postgresql/data

  app:
    container_name: cb_template_app
    build: ./app
    restart: always
    expose:
      - 8013
    depends_on:
      - db
      - redis
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY:?not set - copy .example.env to .env and fill it in}

  nginx:
    container_name: cb_template_nginx
    build: ./nginx
    depends_on:
     - app
    restart: always
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./certificates:/etc/letsencrypt
      - ./webroot:/var/www/certbot
