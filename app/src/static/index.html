<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot Template</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* --------------------
       Design Tokens
    -------------------- */
    :root {
      --bg: #030b07;
      --bg-elev: rgba(52, 211, 153, 0.05);
      --panel: rgba(52, 211, 153, 0.06);
      --text: #d9e9df;
      --text-dim: #7f9c8b;
      --primary: #16a34a;
      --primary-600: #15803d;
      --success: #10b981;
      --danger: #ff6b6b;
      --warning: #ffd36e;
      --border: rgba(52, 211, 153, 0.13);
      --shadow: 0 10px 30px rgba(0, 10, 6, 0.6);
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius: 12px;
      --radius-sm: 10px;
      --blur: 10px;
    }

    /* --------------------
       Global
    -------------------- */
    html, body {
      height: 100%;
      /* dark-only UI: keep native controls and scrollbars dark too */
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 800px at 20% -10%, #0a2418 0%, transparent 60%),
                  radial-gradient(900px 700px at 110% 10%, #06251f 0%, transparent 50%),
                  linear-gradient(180deg, #020806 0%, #030b07 100%);
      overflow: hidden;
    }

    .app-shell {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 14px;
      box-sizing: border-box;
    }

    /* --------------------
       Header
    -------------------- */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      backdrop-filter: blur(var(--blur));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700;
    }

    .brand .logo {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(135deg, #16a34a 0%, #0d9488 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 6px 18px rgba(0,0,0,0.25);
    }

    .brand .title {
      letter-spacing: 0.2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
    }

    .status-connected { background: var(--success); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18); }

    .email-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 280px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-elev);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease;
    }

    /* Clicking the pill ends the session, so it warns on hover rather than inviting a click */
    .email-box:hover { border-color: var(--danger); color: var(--danger); }
    .email-box svg { flex-shrink: 0; opacity: .7; }
    .email-box:hover svg { opacity: 1; }

    #emailLabel {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* --------------------
       Session modal
    -------------------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 8, 6, 0.72);
      backdrop-filter: blur(var(--blur));
    }

    .modal {
      width: 100%;
      max-width: 420px;
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--panel);
      box-shadow: var(--shadow);
      animation: fadeIn .2s ease;
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: 19px;
      font-weight: 600;
    }

    .modal p {
      margin: 0 0 18px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .modal-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-elev);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .2s ease;
    }

    .modal-input:focus { border-color: var(--primary); }

    .modal-error {
      margin-top: 10px;
      color: var(--danger);
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--primary), var(--primary-600));
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 18px rgba(21, 128, 61, 0.35);
    }

    .btn-ghost { background: var(--bg-elev); }

    /* --------------------
       Content Area
    -------------------- */
    .content {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 14px;
      min-height: 0; /* allow children to scroll */
    }

    @media (max-width: 1100px) {
      .content { grid-template-columns: 1fr; }
      .side { display: none; }
    }

    .chat-panel {
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 14px;
      min-height: 0;
    }

    .chat-messages {
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--panel);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      scroll-behavior: smooth;
    }

    .message {
      display: grid;
      /* Prevent wide content from overflowing the chat area */
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      margin-bottom: 16px;
      animation: fadeIn .25s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
      display: grid; place-items: center;
      /* dark ink reads far better than white on these bright greens */
      color: #04150e; font-weight: 800; font-size: 14px;
      user-select: none;
    }

    .avatar.user { background: linear-gradient(135deg, #4ade80, #16a34a); }

    .bubble {
      /* Allow the bubble to shrink within the grid column */
      min-width: 0;
      max-width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(52,211,153,0.03);
    }

    .user .bubble { background: linear-gradient(180deg, rgba(16,185,129,0.14), rgba(16,185,129,0.06)); }
    .bot .bubble { background: linear-gradient(180deg, rgba(52,211,153,0.08), rgba(52,211,153,0.03)); }
    .error .bubble {
      background: linear-gradient(180deg, rgba(255,107,107,0.18), rgba(255,107,107,0.1));
      border-color: var(--danger);
    }

    .message-content { color: var(--text); line-height: 1.6; word-break: break-word; overflow-wrap: anywhere; }
    .message-content.error-text { color: var(--danger); font-weight: 500; }
    .message-content h1, .message-content h2, .message-content h3 { margin: .6em 0 .3em; }
    .message-content pre { background: rgba(1,9,5,.9); border-radius: 12px; padding: 12px; overflow: auto; }
    .message-content code { background: rgba(52,211,153,.09); padding: 2px 6px; border-radius: 6px; }
    .message-content blockquote { border-left: 3px solid var(--border); margin: .6em 0; padding-left: 12px; color: var(--text-dim); }

    .streaming-cursor { animation: blink 1s infinite; opacity: .7; margin-left: 2px; }
    @keyframes blink { 0%,50%{opacity:.7}51%,100%{opacity:0} }

    /* --------------------
       Suggestions & Controls (Side)
    -------------------- */
    .side {
      display: grid;
      grid-template-rows: 1fr;
      gap: 14px;
      min-height: 0;
    }

    .card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--panel);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
    }

    .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--text-dim); font-weight: 700; letter-spacing: .2px; }

    /* --------------------
       Conversations List
    -------------------- */
    .conversations-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .no-conversations {
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
      padding: 12px;
    }

    .conversation-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .2s ease;
      position: relative;
    }

    .conversation-item:hover {
      background: rgba(52,211,153,0.07);
      transform: translateY(-1px);
    }

    .conversation-item.active {
      background: linear-gradient(180deg, rgba(22,163,74,0.22), rgba(22,163,74,0.08));
      border-color: var(--primary);
    }

    .conversation-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .conversation-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
    }

    .conversation-date {
      opacity: 0.7;
    }

    .conversation-count {
      background: rgba(52,211,153,0.1);
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
    }

    .conversation-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: rgba(255,107,107,0.8);
      border: none;
      color: white;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .conversation-item:hover .conversation-delete {
      opacity: 1;
    }

    .conversation-delete:hover {
      background: var(--danger);
    }

    /* --------------------
       Composer
    -------------------- */
    .composer {
      position: sticky; bottom: 0; /* pin within grid cell */
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
    }

    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 10px; border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
    }

    textarea#messageInput {
      resize: none; max-height: 200px; min-height: 46px;
      width: 100%;
      border: none; outline: none;
      background: transparent; color: var(--text);
      font-size: 15px; line-height: 1.5;
      transition: opacity 0.2s ease;
    }

    textarea#messageInput:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .actions { display: flex; gap: 10px; align-items: center; }

    .kbd { font-size: 12px; color: var(--text-dim); border: 1px solid var(--border); padding: 4px 6px; border-radius: 6px; }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="app-shell" id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">Chatbot Template</div>
      </div>
      <div class="header-actions">
        <div id="emailBox" class="email-box hidden" title="Clear session">
          <!-- logout icon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          <span id="emailLabel"></span>
        </div>
        <button id="newChatBtn" class="btn btn-ghost" title="Start a new chat">
          <!-- plus icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New Chat
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="content">
      <section class="chat-panel">
        <div id="chatMessages" class="chat-messages" aria-live="polite" aria-busy="false"></div>

        <!-- Composer -->
        <div class="composer">
          <div class="input-wrap">
            <textarea id="messageInput" placeholder="Type your message…"></textarea>
            <!-- <div class="actions">
              <span class="kbd">Enter</span><span class="text-muted"> to send </span><span class="kbd">Shift+Enter</span> for newline
            </div> -->
          </div>
          <div class="actions">
            <button id="sendButton" class="btn btn-primary">Send</button>
          </div>
        </div>
      </section>

      <aside class="side">
        <div class="card" style="display: flex; flex-direction: column; min-height: 0;">
          <h3>Conversations</h3>
          <div id="conversationsList" class="conversations-list">
            <div class="no-conversations">No conversations yet</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Session gate: shown whenever there is no session, and not dismissible without one -->
  <div id="emailModal" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="emailModalTitle">
      <h2 id="emailModalTitle">Welcome</h2>
      <p>Enter your email to start a session. Your conversations are kept under this address.</p>
      <input id="modalEmailInput" class="modal-input" type="email" placeholder="you@example.com"
             spellcheck="false" autocomplete="email" />
      <div id="modalEmailError" class="modal-error hidden"></div>
      <div class="modal-actions">
        <button id="modalSubmitBtn" class="btn btn-primary">Continue</button>
      </div>
    </div>
  </div>

  <script>
    // The session cookie is the source of truth; this is only what the server told us it holds.
    let EMAIL = null;

    // Kept in step with EMAIL_PATTERN in schema.py
    const EMAIL_PATTERN = /^[^\s@:]+@[^\s@:]+$/;

    // ---------- Markdown config ----------
    marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

    // ---------- DOM refs ----------
    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const newChatBtn = document.getElementById('newChatBtn');
    const emailBox = document.getElementById('emailBox');
    const emailLabel = document.getElementById('emailLabel');
    const conversationsList = document.getElementById('conversationsList');
    const emailModal = document.getElementById('emailModal');
    const modalEmailInput = document.getElementById('modalEmailInput');
    const modalEmailError = document.getElementById('modalEmailError');
    const modalSubmitBtn = document.getElementById('modalSubmitBtn');

    // ---------- State ----------
    let conversationId = null;
    let currentStreamingMessage = null;
    let currentStreamingContent = '';
    let isStreaming = false;

    // ---------- Session ----------
    function renderEmail() {
      emailLabel.textContent = EMAIL || '';
      emailBox.title = `Signed in as ${EMAIL} - click to clear the session`;
      emailBox.classList.toggle('hidden', !EMAIL);
    }

    function showEmailModal() {
      modalEmailInput.value = '';
      hideModalError();
      emailModal.classList.remove('hidden');
      setInputEnabled(false);
      modalEmailInput.focus();
    }

    function hideEmailModal() {
      emailModal.classList.add('hidden');
      setInputEnabled(true);
    }

    function showModalError(message) {
      modalEmailError.textContent = message;
      modalEmailError.classList.remove('hidden');
    }

    function hideModalError() {
      modalEmailError.classList.add('hidden');
    }

    async function submitEmail() {
      const email = modalEmailInput.value.trim();
      if (!EMAIL_PATTERN.test(email)) {
        showModalError('Enter a valid email address');
        modalEmailInput.focus();
        return;
      }
      hideModalError();

      try {
        const response = await fetch('/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        EMAIL = data.email;
        hideEmailModal();
        renderEmail();
        clearChat();
        await refreshConversations();
      } catch (e) {
        console.error('Error starting session:', e);
        showModalError('Could not start a session, please try again');
      }
    }

    async function clearSession() {
      try {
        await fetch('/session', { method: 'DELETE' });
      } catch (e) {
        console.error('Error clearing session:', e);
      }
      resetToSignedOut();
    }

    /** Drop every trace of the previous user and put the gate back up. */
    function resetToSignedOut() {
      EMAIL = null;
      clearChat();
      conversationsList.innerHTML = '<div class="no-conversations">No conversations yet</div>';
      renderEmail();
      // Last, because clearChat() re-enables the composer
      showEmailModal();
    }

    /** Called whenever the server says the session is gone, e.g. after the cookie expires. */
    function handleUnauthorized() {
      if (!emailModal.classList.contains('hidden')) return;
      resetToSignedOut();
    }

    // ---------- Helpers ----------
    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function scrollToBottom(force = false) {
      if (force) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return;
      }

      // Only auto-scroll if user is already near the bottom (within 100px)
      const threshold = 100;
      const isNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight <= threshold;

      if (isNearBottom) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }


    function setInputEnabled(enabled) {
      messageInput.disabled = !enabled;
      sendButton.disabled = !enabled;
    }

    function messageRow(isUser, isError = false) {
      const row = document.createElement('div');
      row.className = `message ${isUser ? 'user' : 'bot'}${isError ? ' error' : ''}`;

      const avatar = document.createElement('div');
      avatar.className = `avatar ${isUser ? 'user' : 'bot'}`;
      avatar.textContent = isUser ? 'YOU' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const content = document.createElement('div');
      content.className = 'message-content';
      bubble.appendChild(content);

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      scrollToBottom(true); // Force scroll for new messages
      return content;
    }

    function addMessage(content, isUser = false, messageType = null) {
      const contentEl = messageRow(isUser, messageType === 'error');
      if (isUser) {
        contentEl.textContent = content;
      } else {
        if (messageType === 'error') {
          contentEl.classList.add('error-text');
        }
        try {
          contentEl.innerHTML = marked.parse(content);
          contentEl.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
        } catch (e) { contentEl.textContent = content; }
      }
    }

    function startStreamingMessage() {
      const el = messageRow(false);
      currentStreamingMessage = el;
      currentStreamingContent = '';
      isStreaming = true;
      setInputEnabled(false);
    }

    function appendStreamingToken(token) {
      if (!currentStreamingMessage) return;
      currentStreamingContent += token;
      try {
        currentStreamingMessage.innerHTML = marked.parse(currentStreamingContent);
        currentStreamingMessage.querySelectorAll('pre code').forEach((b) => hljs.highlightElement(b));
        const cursor = document.createElement('span');
        cursor.className = 'streaming-cursor';
        cursor.textContent = '|';
        currentStreamingMessage.appendChild(cursor);
      } catch { currentStreamingMessage.textContent = currentStreamingContent; }
      scrollToBottom(); // Conditional scroll during streaming
    }

    function finishStreamingMessage() {
      if (!currentStreamingMessage) return;
      const cursor = currentStreamingMessage.querySelector('.streaming-cursor');
      if (cursor) cursor.remove();
      try {
        currentStreamingMessage.innerHTML = marked.parse(currentStreamingContent);
        currentStreamingMessage.querySelectorAll('pre code').forEach((b) => hljs.highlightElement(b));
      } catch { currentStreamingMessage.textContent = currentStreamingContent; }
      currentStreamingMessage = null;
      currentStreamingContent = '';
      isStreaming = false;
      setInputEnabled(true);
      scrollToBottom(true);
    }

    function clearChat() {
      messagesContainer.innerHTML = '';
      currentStreamingMessage = null;
      currentStreamingContent = '';
      isStreaming = false;
      conversationId = null;
      messageInput.placeholder = 'Type your message…';
      setInputEnabled(true);
      updateConversationActiveState();
    }

    // ---------- Networking (Streaming) ----------
    async function handleStreamResponse(response) {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // Hold back the tail: an event can be split across two reads
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (let line of lines) {
            line = line.trim();
            if (!line.startsWith('data: ')) continue;

            const dataStr = line.slice(6);
            if (dataStr === '[DONE]') {
              finishStreamingMessage();
              return;
            }

            try {
              handleStreamEvent(JSON.parse(dataStr));
            } catch (e) {
              console.warn('Failed to parse event data:', dataStr);
            }
          }
        }
      } finally {
        reader.releaseLock();
      }
    }

    function handleStreamEvent(data) {
      console.log('Stream event:', data);
      switch (data.type) {
        case 'start':
          // Message started
          break;
        case 'data-conversation':
          conversationId = data.data?.conversationId;
          break;
        case 'data-agent':
          // Agent started responding
          if (data.data?.agent) {
            if (!isStreaming) {
              startStreamingMessage();
            }
          }
          break;
        case 'text-start':
          if (!isStreaming) {
            startStreamingMessage();
          }
          break;
        case 'text-delta':
          appendStreamingToken(data.delta || '');
          break;
        case 'text-end':
          finishStreamingMessage();
          break;
        case 'error':
          if (isStreaming) finishStreamingMessage();
          addMessage(`ERROR: ${data.errorText || 'Unknown error'}`, false, 'error');
          setInputEnabled(true);
          break;
        case 'finish':
          if (isStreaming) finishStreamingMessage();
          setInputEnabled(true);
          break;
      }
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      if (isStreaming) return; // Prevent sending while streaming

      addMessage(message, true);
      messageInput.value = '';
      autoResizeTextarea(messageInput);
      setInputEnabled(false);

      try {
        const requestBody = {
          query: message,
          conversation_id: conversationId
        };

        const response = await fetch('/conversations/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        // The session can lapse while the tab sits idle; re-prompt instead of failing silently
        if (response.status === 401) { handleUnauthorized(); return; }

        await handleStreamResponse(response);

        // Refresh conversations list after successful message
        await refreshConversations();
      } catch (e) {
        console.error('Error sending message:', e);
        addMessage('Error sending message', false, 'error');
        setInputEnabled(true);
      }
    }

    // ---------- Conversation Management ----------
    async function fetchConversations() {
      try {
        const response = await fetch('/conversations', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        if (response.status === 401) { handleUnauthorized(); return null; }
        if (!response.ok) throw new Error('Failed to fetch conversations');
        return await response.json();
      } catch (e) {
        console.error('Error fetching conversations:', e);
        return null;
      }
    }

    async function loadConversation(conversationIdToLoad) {
      try {
        const response = await fetch(`/conversations/${conversationIdToLoad}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        if (response.status === 401) { handleUnauthorized(); return; }
        if (!response.ok) throw new Error('Failed to load conversation');
        const data = await response.json();

        // Clear current messages
        messagesContainer.innerHTML = '';

        // Load messages
        data.messages.forEach(message => {
          addMessage(message.content, message.source === 'user');
        });

        // Update current conversation ID
        conversationId = conversationIdToLoad;
        updateConversationActiveState();
        scrollToBottom(true);

      } catch (e) {
        console.error('Error loading conversation:', e);
      }
    }

    async function deleteConversation(conversationIdToDelete) {
      try {
        const response = await fetch(`/conversations/${conversationIdToDelete}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' }
        });
        if (response.status === 401) { handleUnauthorized(); return; }
        if (!response.ok) throw new Error('Failed to delete conversation');

        // If this was the current conversation, clear it
        if (conversationId === conversationIdToDelete) {
          clearChat();
        }

        // Refresh conversations list
        await refreshConversations();

      } catch (e) {
        console.error('Error deleting conversation:', e);
      }
    }

    function formatRelativeTime(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (diffMins < 1) return 'now';
      if (diffMins < 60) return `${diffMins}m`;
      if (diffHours < 24) return `${diffHours}h`;
      if (diffDays < 7) return `${diffDays}d`;
      return date.toLocaleDateString();
    }

    function updateConversationsList(conversationsData) {
      if (!conversationsData || !conversationsData.conversations || conversationsData.conversations.length === 0) {
        conversationsList.innerHTML = '<div class="no-conversations">No conversations yet</div>';
        return;
      }

      conversationsList.innerHTML = '';
      conversationsData.conversations.forEach(conv => {
        const convItem = document.createElement('div');
        convItem.className = 'conversation-item';
        convItem.dataset.conversationId = conv.id;

        const title = document.createElement('div');
        title.className = 'conversation-title';
        title.textContent = conv.title || 'New Conversation';

        const meta = document.createElement('div');
        meta.className = 'conversation-meta';

        const date = document.createElement('span');
        date.className = 'conversation-date';
        date.textContent = formatRelativeTime(conv.updated_at);

        const count = document.createElement('span');
        count.className = 'conversation-count';
        count.textContent = `${conv.message_count}`;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'conversation-delete';
        deleteBtn.innerHTML = '×';
        deleteBtn.title = 'Delete conversation';

        meta.appendChild(date);
        meta.appendChild(count);

        convItem.appendChild(title);
        convItem.appendChild(meta);
        convItem.appendChild(deleteBtn);

        // Event listeners
        convItem.addEventListener('click', (e) => {
          if (e.target === deleteBtn) return; // Don't load if delete button clicked
          loadConversation(conv.id);
        });

        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Delete this conversation?')) {
            deleteConversation(conv.id);
          }
        });

        conversationsList.appendChild(convItem);
      });

      updateConversationActiveState();
    }

    function updateConversationActiveState() {
      const items = conversationsList.querySelectorAll('.conversation-item');
      items.forEach(item => {
        if (item.dataset.conversationId === conversationId) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    async function refreshConversations() {
      const conversationsData = await fetchConversations();
      updateConversationsList(conversationsData);
    }

    // ---------- Init ----------
    async function initializeApp() {
      autoResizeTextarea(messageInput);

      // The session cookie decides whether we chat or ask who is chatting
      let session = null;
      try {
        const response = await fetch('/session');
        if (response.ok) session = await response.json();
      } catch (e) {
        console.error('Error reading session:', e);
      }

      if (!session) {
        renderEmail();
        showEmailModal();
        return;
      }

      EMAIL = session.email;
      renderEmail();
      await refreshConversations();
    }

    // ---------- Events ----------
    emailBox.addEventListener('click', clearSession);

    modalSubmitBtn.addEventListener('click', submitEmail);
    modalEmailInput.addEventListener('input', hideModalError);
    modalEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitEmail(); }
    });

    sendButton.addEventListener('click', sendMessage);
    newChatBtn.addEventListener('click', clearChat);
    messageInput.addEventListener('input', () => autoResizeTextarea(messageInput));
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    initializeApp();
  </script>
</body>
</html>
